<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yes</title>

    <style>
        body {
            background-color: #3f403f;
            color: white;
        }
        h1, h2, h3, h4 {
            color: white;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }
        hr {
            border-color: #4e4f4e;
        }
        .smol-text {
            font-size: 12px;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }
        .shaking {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
  <h1>hi</h1>
  <h2>i do know HTML</h2>
  <h3>but i do not know CSS <span class="smol-text">now i know a bit</span></h3>
  <h4>and i have to do the 3 AM challenge</h4>
  <hr>
  <h1><marquee>a bit of styling</marquee></h1>
  <hr>
  <br>
  <h1 class="shaking">LET ME SLEEP</h1>
</body>
</html>
