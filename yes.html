<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yes</title>

    <style>
        body {
            background-color: #3f403f;
            color: white;
        }
        h1, h2, h3, h4 {
            color: white;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }
        hr {
            border-color: #4e4f4e;
        }
        .smol-text {
            font-size: 12px;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }
        .help-me {
            display: inline-block;
            animation: shake 0.15s infinite steps(1);
        }

        @keyframes shake {
            0% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-8px, 5px);
            }

            40% {
                transform: translate(8px, -6px);
            }

            60% {
                transform: translate(-6px, -8px);
            }

            80% {
                transform: translate(7px, 6px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
        .shaking {
            display: inline-block;
            animation: shake2 0.15s infinite steps(1);
            color: #ff0000;
        }

        @keyframes shake2 {
            0% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-8px, 5px);
            }

            40% {
                transform: translate(8px, -6px);
            }

            60% {
                transform: translate(-6px, -8px);
            }

            80% {
                transform: translate(7px, 6px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>
<body>
  <h1>hi</h1>
  <h2>i do know HTML</h2>
  <h3>but i do not know CSS <span class="smol-text">now i know a bit</span></h3>
  <h4><del>and i have to do the 3 AM challenge</del> my eyes burn <del>i cant do it</del> yes i can im not an idiot</h4>
  <hr>
  <h1><marquee>a bit of styling</marquee></h1>
  <hr>
  <br>
  <h1 class="help-me">LET ME SLEEP</h1>
</body>
</html>
