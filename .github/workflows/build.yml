name: build

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: myrepo
  PACKAGER_NAME: ${{ secrets.PACKAGER_NAME }}
  PACKAGER_EMAIL: ${{ secrets.PACKAGER_EMAIL }}
  GPGKEY: ${{ secrets.GPGKEY }}
  RELEASE_TAG: repo

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system and install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git gnupg sudo github-cli

      - name: Fetch existing release assets (preserves manually-uploaded packages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "coolguy565 pacman repo" || true
          mkdir -p repo
          gh release download "$RELEASE_TAG" --dir repo \
            --pattern '*.pkg.tar.zst*' --pattern '*.db.tar.gz*' --pattern '*.asc' 2>/dev/null || true
          ls repo/ 2>/dev/null || true

      - name: Create builder user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages and create repo
        env:
          GPG_KEY_B64: ${{ secrets.GPG_KEY_B64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: su builder -c "cd \"$GITHUB_WORKSPACE\" && ./build.sh"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            repo/myrepo.db.tar.gz repo/myrepo.db.tar.gz.sig \
            repo/myrepo.files.tar.gz repo/myrepo.files.tar.gz.sig \
            repo/myrepo.asc \
            packages/*/*.pkg.tar.zst packages/*/*.pkg.tar.zst.sig
