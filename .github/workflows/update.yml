name: update-pkgbuilds

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nvchecker
        run: pip install --break-system-packages nvchecker

      - name: Update PKGBUILDs
        run: ./update.sh

      - name: Commit and push
        run: |
          git config user.name "coolguy565"
          git config user.email "shower.headedyt@gmail.com"
          git add -A
          git commit -m "auto: bump package versions" || echo "no changes to commit"
          git push origin main
